# Vérification automatique : à chaque envoi de code vers dev ou main et à chaque pull request,
# on contrôle les types puis on lance les tests (et la construction du site).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Typage TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Vérifier le schéma de la base
        run: node ../database/verifier.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typage et construction
        run: npm run build
